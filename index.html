<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BlockCraft</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; }
  #ui { cursor: default; }
  #boot { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: #ef323d; color: #fff; font: 16px monospace; z-index: 10; }
  #boot .logo { font: bold 42px monospace; letter-spacing: 4px; text-shadow: 3px 3px 0 #7a0f14; }
  #boot .bar { width: 320px; max-width: 80vw; height: 10px; border: 2px solid #fff; }
  #boot #boot-bar { height: 100%; width: 0; background: #fff; transition: width .15s; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<canvas id="ui" tabindex="0"></canvas>
<div id="boot"><div class="logo">BLOCKCRAFT</div><div id="boot-text">Loading…</div><div class="bar"><div id="boot-bar"></div></div></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
