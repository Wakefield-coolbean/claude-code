<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sus Station</title>
<meta name="description" content="A social deduction game with Among Us-style gameplay, visuals and pacing. Freeplay against bots.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Varela+Round&display=swap">
<link rel="stylesheet" href="src/style.css">
</head>
<body>
<div id="app" class="in-menu">
  <canvas id="view" aria-label="Game view"></canvas>
  <div id="hud" class="hud"></div>
  <div id="lobby" class="lobby-ui" hidden></div>
  <div id="joy" class="joy" hidden><div class="joy-knob"></div></div>
  <div id="meeting" class="meeting-root" hidden></div>
  <div id="minigame" class="mg-overlay" hidden></div>
  <div id="screen" class="screen boot">
    <div class="boot-msg">
      <p class="boot-title">Sus Station</p>
      <p>Loading…</p>
      <p class="boot-help">If this message stays, the game can't run here. Open the file in a web browser such as Chrome, Safari or Firefox (file previews and some in-app viewers don't run games).</p>
    </div>
  </div>
</div>
<script src="node_modules/peerjs/dist/peerjs.min.js"></script>
<script type="module" src="src/main.js"></script>
</body>
</html>
