name: PhoneMouse IPA

on:
  push:
    paths:
      - "PhoneMouse/**"
      - ".github/workflows/phonemouse-ipa.yml"
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the release

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: xcodebuild -version && swift --version

      - name: Unit-test the motion core
        working-directory: PhoneMouse
        run: |
          set -o pipefail
          swift test -c release 2>&1 | tail -n 60

      - name: Build the app (unsigned, device)
        working-directory: PhoneMouse
        run: |
          set -o pipefail
          xcodebuild -project PhoneMouse.xcodeproj -scheme PhoneMouse \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | grep -E "error|warning: unre|BUILD|\*\*" | tail -n 80

      - name: Package IPA
        run: |
          mkdir -p out/Payload
          cp -R "$RUNNER_TEMP/dd/Build/Products/Release-iphoneos/PhoneMouse.app" out/Payload/
          (cd out && zip -qry PhoneMouse-unsigned.ipa Payload)
          cp PhoneMouse/server/phonemouse_server.py PhoneMouse/server/requirements.txt out/
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: PhoneMouse
          path: |
            out/PhoneMouse-unsigned.ipa
            out/phonemouse_server.py
            out/requirements.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=phonemouse-latest
          gh release delete "$TAG" --cleanup-tag --yes || true
          gh release create "$TAG" --target "$GITHUB_SHA" \
            --title "PhoneMouse (build ${{ github.run_number }})" \
            --notes "Unsigned IPA of the PhoneMouse iPhone app plus the desktop receiver. Install the IPA with a sideloading tool such as AltStore or Sideloadly, then run phonemouse_server.py on your computer. See PhoneMouse/README.md for setup." \
            out/PhoneMouse-unsigned.ipa out/phonemouse_server.py out/requirements.txt
