<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Rocket Roundtrip</title>
<meta name="description" content="A cartoon 3D idle rocket game: build, launch, stage and bring your pilot home alive.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #1b1d3d;
  --ink-2: #454a7a;
  --ink-3: #8a90b8;
  --paper: #ffffff;
  --panel: #f3f7ff;
  --line: #d7e0f4;
  --sky: #2fb8f0;
  --sky-d: #1492cc;
  --orange: #ff7a1a;
  --orange-d: #e05d00;
  --pink: #ff4f8b;
  --lemon: #ffd23f;
  --lemon-d: #e8b400;
  --lime: #4fcf5a;
  --lime-d: #2fa83b;
  --red: #ff3b4f;
  --red-d: #d61f33;
  --violet: #7a5cff;
  --night: #0c1233;
  --hard: 0 4px 0 var(--ink);
  --display: 'Lilita One', 'Arial Rounded MT Bold', 'Trebuchet MS', system-ui, sans-serif;
  --body: 'Nunito', 'Segoe UI', system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body { background: var(--night); color: var(--ink); font-family: var(--body); font-weight: 700; overflow: hidden; overscroll-behavior: none; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
button { font-family: var(--body); font-weight: 800; color: var(--ink); cursor: pointer; }
button:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }
[hidden] { display: none !important; }
.num { font-variant-numeric: tabular-nums; }

#game { position: fixed; inset: 0; overflow: hidden; }
#view { position: absolute; inset: 0; }
#view canvas { display: block; width: 100%; height: 100%; }

/* ---------- chunky shared pieces ---------- */
.card { background: var(--paper); border: 3px solid var(--ink); border-radius: 16px; box-shadow: var(--hard); }
.btn { border: 3px solid var(--ink); border-radius: 14px; background: var(--paper); box-shadow: var(--hard); padding: 8px 14px; font-size: 15px; transition: transform .06s, box-shadow .06s, filter .15s; }
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.btn:disabled { filter: grayscale(.8) opacity(.55); cursor: not-allowed; }
.btn.orange { background: var(--orange); color: #fff; }
.btn.lime { background: var(--lime); color: #fff; }
.btn.sky { background: var(--sky); color: #fff; }
.btn.lemon { background: var(--lemon); }
.btn.red { background: var(--red); color: #fff; }
.btn.small { padding: 5px 10px; font-size: 13px; border-radius: 11px; }
.label { font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-2); font-weight: 900; }
.display { font-family: var(--display); font-weight: 400; letter-spacing: .01em; }

/* ---------- top bar ---------- */
#topbar { position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: center; gap: 12px; padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px; pointer-events: none; z-index: 5; }
#topbar > * { pointer-events: auto; }
.brand { font-family: var(--display); font-size: 22px; color: #fff; text-shadow: 0 3px 0 var(--ink), 2px 0 0 var(--ink), -2px 0 0 var(--ink), 0 -2px 0 var(--ink); white-space: nowrap; display: flex; align-items: center; gap: 8px; }
.brand svg { flex: none; }
.cashbox { display: flex; align-items: center; gap: 10px; padding: 6px 14px 6px 8px; }
.coin { width: 34px; height: 34px; border-radius: 50%; background: var(--lemon); border: 3px solid var(--ink); display: grid; place-items: center; font-family: var(--display); font-size: 19px; flex: none; }
.money { font-family: var(--display); font-size: 26px; line-height: 1; }
.rate { font-size: 12px; color: var(--lime-d); font-weight: 900; }
.starsbox { padding: 6px 12px; font-family: var(--display); font-size: 20px; color: var(--ink); background: var(--lemon); display: flex; gap: 6px; align-items: center; }
#goal { flex: 1 1 auto; min-width: 0; max-width: 520px; margin-left: auto; text-align: left; padding: 7px 12px; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; align-items: center; }
#goal .gflag { grid-row: span 2; width: 34px; height: 34px; border-radius: 10px; background: var(--pink); border: 3px solid var(--ink); display: grid; place-items: center; }
#goal .gtext { font-size: 14px; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#goal .gbar { height: 8px; border-radius: 6px; background: var(--line); overflow: hidden; border: 2px solid var(--ink); }
#goal .gbar i { display: block; height: 100%; background: var(--pink); width: 0; }
.icon-btn { width: 44px; height: 44px; padding: 0; display: grid; place-items: center; flex: none; }

/* ---------- hangar ---------- */
#hangar { position: absolute; inset: 0; pointer-events: none; }
#hangar > * { pointer-events: auto; }
.panel { position: absolute; top: calc(76px + env(safe-area-inset-top, 0px)); bottom: 108px; width: 340px; display: flex; flex-direction: column; overflow: hidden; background: rgba(255,255,255,.96); }
#leftPanel { left: 16px; }
#rightPanel { right: 16px; width: 300px; }
.tabs { display: flex; gap: 6px; padding: 10px 10px 0; flex: none; }
.tabs button { flex: 1; border: 3px solid var(--ink); border-bottom: 0; border-radius: 12px 12px 0 0; background: var(--panel); padding: 9px 4px 7px; font-size: 14px; }
.tabs button.on { background: var(--orange); color: #fff; }
.tabs button[data-tab="rocket"] { display: none; }
.tabbody { border-top: 3px solid var(--ink); flex: 1; overflow-y: auto; padding: 12px; scrollbar-width: thin; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.chips button { border: 2.5px solid var(--ink); border-radius: 999px; background: var(--paper); padding: 5px 11px; font-size: 13px; }
.chips button.on { background: var(--ink); color: #fff; }
.partlist { display: flex; flex-direction: column; gap: 8px; }
.part { border: 2.5px solid var(--ink); border-radius: 14px; background: var(--paper); padding: 9px 10px; display: grid; grid-template-columns: 40px 1fr auto; gap: 4px 10px; align-items: center; text-align: left; }
.part .pic { width: 40px; height: 40px; grid-row: span 2; }
.part .pname { font-size: 15px; font-weight: 900; line-height: 1.1; }
.part .pdesc { font-size: 12px; color: var(--ink-2); font-weight: 700; line-height: 1.25; grid-column: 2 / 4; }
.part .pstats { grid-column: 1 / 4; display: flex; flex-wrap: wrap; gap: 4px; }
.pstat { font-size: 11px; font-weight: 900; background: var(--panel); border: 2px solid var(--line); border-radius: 8px; padding: 1px 6px; color: var(--ink-2); white-space: nowrap; }
.part.locked { opacity: .55; }
.part .pact { grid-row: 1; grid-column: 3; }
.part.owned { cursor: pointer; }
.part.owned:hover { background: #fff8ec; }
.part.fresh { box-shadow: 0 0 0 3px var(--lemon); }
.tag { font-size: 11px; font-weight: 900; border-radius: 8px; padding: 2px 7px; border: 2px solid var(--ink); white-space: nowrap; }
.tag.in { background: var(--lime); color: #fff; }
.tag.lock { background: var(--line); }

.stack { display: flex; flex-direction: column; gap: 8px; }
.sec { border: 2.5px solid var(--ink); border-radius: 14px; padding: 8px; background: var(--paper); }
.sec.sel { background: #fff4e6; box-shadow: 0 0 0 3px var(--orange); }
.sec h4 { margin: 0 0 6px; font-size: 13px; display: flex; align-items: center; gap: 6px; }
.sec h4 .sp { margin-left: auto; }
.row { display: flex; align-items: center; gap: 6px; font-size: 13px; padding: 3px 0; }
.row .sw { width: 12px; height: 12px; border-radius: 4px; border: 2px solid var(--ink); flex: none; }
.row .rn { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .rk { color: var(--ink-3); font-size: 11px; font-weight: 900; text-transform: uppercase; letter-spacing: .06em; }
.x { width: 24px; height: 24px; border-radius: 8px; border: 2px solid var(--ink); background: var(--paper); font-size: 13px; line-height: 1; padding: 0; flex: none; }
.x:hover { background: var(--red); color: #fff; }
.addstage { width: 100%; border-style: dashed; }
.rstats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 12px; }
.stat { background: var(--panel); border: 2px solid var(--line); border-radius: 12px; padding: 6px 8px; }
.stat b { display: block; font-family: var(--display); font-weight: 400; font-size: 18px; line-height: 1.1; }
.stat.bad b { color: var(--red-d); }
.stat.good b { color: var(--lime-d); }
.warns { margin-top: 10px; display: flex; flex-direction: column; gap: 5px; }
.warn { font-size: 12.5px; border-radius: 10px; padding: 6px 9px; border: 2px solid var(--ink); background: var(--lemon); }
.warn.bad { background: var(--red); color: #fff; }

#launchBar { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; align-items: flex-end; gap: 12px; }
#btnLaunch { font-family: var(--display); font-weight: 400; font-size: 30px; padding: 14px 36px; border-radius: 20px; background: var(--orange); color: #fff; letter-spacing: .02em; text-shadow: 0 2px 0 var(--orange-d); box-shadow: 0 6px 0 var(--ink); }
#btnLaunch:not(:disabled) { animation: bob 1.6s ease-in-out infinite; }
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
#planSel { padding: 8px; display: flex; flex-direction: column; gap: 6px; }
#planSel .seg { display: flex; gap: 4px; }
#planSel .seg button { border: 2.5px solid var(--ink); border-radius: 10px; background: var(--panel); padding: 5px 9px; font-size: 13px; }
#planSel .seg button.on { background: var(--sky); color: #fff; }
#planSel .opts { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12.5px; align-items: center; }
#planSel label { display: flex; align-items: center; gap: 4px; cursor: pointer; }
#planSel input { width: 18px; height: 18px; accent-color: var(--orange); }

.upgrp { margin: 4px 0 14px; }
.upgrp h3 { font-family: var(--display); font-weight: 400; font-size: 19px; margin: 6px 0 8px; }
.up { border: 2.5px solid var(--ink); border-radius: 14px; padding: 8px 10px; display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; background: var(--paper); margin-bottom: 7px; }
.up .un { font-size: 14.5px; font-weight: 900; }
.up .ud { font-size: 12px; color: var(--ink-2); grid-column: 1; }
.up .ulv { font-size: 12px; color: var(--violet); font-weight: 900; grid-column: 1; }
.up .btn { grid-row: 1 / span 3; grid-column: 2; min-width: 92px; }
.up.maxed .btn { background: var(--lime); color: #fff; }
.agency p { font-size: 13.5px; line-height: 1.45; color: var(--ink-2); margin: 6px 0; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 13.5px; margin: 8px 0 14px; }
.kv span:nth-child(even) { text-align: right; font-weight: 900; }
.prest { border: 3px solid var(--ink); border-radius: 16px; background: linear-gradient(160deg, #fff6d6, #ffe08a); padding: 12px; margin: 10px 0; }
.prest h3 { font-family: var(--display); font-weight: 400; font-size: 22px; margin: 0 0 4px; }
.memorial { font-size: 12.5px; color: var(--ink-2); }

/* ---------- flight HUD ---------- */
#hud { position: absolute; inset: 0; pointer-events: none; }
#hud .card, #hud button { pointer-events: auto; }
#telemetry { position: absolute; left: 16px; top: calc(14px + env(safe-area-inset-top, 0px)); padding: 10px 14px 12px; min-width: 210px; }
#telemetry .big { font-family: var(--display); font-size: 38px; line-height: 1; }
#telemetry .sub { font-size: 12px; color: var(--ink-2); }
.tl { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin-top: 8px; font-size: 13.5px; }
.tl span:nth-child(odd) { color: var(--ink-3); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; align-self: center; }
.tl span:nth-child(even) { text-align: right; font-weight: 900; }
#altbar { position: absolute; left: 16px; top: calc(214px + env(safe-area-inset-top, 0px)); width: 34px; height: 210px; padding: 0; overflow: visible; }
#altbar .fillb { position: absolute; left: 4px; right: 4px; bottom: 4px; border-radius: 8px; background: linear-gradient(0deg, #6fd0ff, #2c64d8 45%, #1b1d3d); }
#altbar .mk { position: absolute; left: 30px; font-size: 10.5px; font-weight: 900; color: #fff; text-shadow: 0 1px 0 var(--ink), 1px 0 0 var(--ink), -1px 0 0 var(--ink), 0 -1px 0 var(--ink); white-space: nowrap; transform: translateY(50%); }
#altbar .mk::before { content: ''; position: absolute; left: -12px; top: 50%; width: 10px; height: 2px; background: #fff; box-shadow: 0 0 0 1px var(--ink); }
#altbar .me { position: absolute; left: -8px; width: 44px; height: 14px; transform: translateY(50%); }
#purse { position: absolute; left: 50%; transform: translateX(-50%); top: calc(14px + env(safe-area-inset-top, 0px)); padding: 8px 18px 8px 10px; display: flex; align-items: center; gap: 10px; }
#purse .money { font-size: 30px; }
#purse .cond { font-size: 11.5px; color: var(--ink-2); line-height: 1.15; max-width: 170px; }
#purse.lost { background: #ffd9dc; }
#purse.lost .money { text-decoration: line-through; color: var(--red-d); }
#pilotCard { position: absolute; right: 16px; top: calc(14px + env(safe-area-inset-top, 0px)); padding: 10px; width: 250px; display: grid; grid-template-columns: 76px 1fr; gap: 6px 10px; }
#pilotCard canvas { width: 76px; height: 76px; border-radius: 50%; border: 3px solid var(--ink); background: #bfe9ff; grid-row: span 3; }
#pilotCard .pn { font-size: 15px; font-weight: 900; }
#pilotCard .ps { font-size: 12.5px; color: var(--ink-2); line-height: 1.2; }
.hbar { height: 14px; border: 2.5px solid var(--ink); border-radius: 8px; background: var(--line); overflow: hidden; }
.hbar i { display: block; height: 100%; width: 100%; background: var(--lime); transition: width .2s; }
.gauges { grid-column: 1 / 3; display: grid; grid-template-columns: auto 1fr auto; gap: 4px 8px; align-items: center; font-size: 11.5px; margin-top: 2px; }
.gauges .gn { color: var(--ink-3); text-transform: uppercase; letter-spacing: .08em; font-weight: 900; }
.gauges .gv { text-align: right; font-weight: 900; min-width: 54px; }
.gbar2 { height: 10px; border: 2px solid var(--ink); border-radius: 6px; background: var(--line); overflow: hidden; }
.gbar2 i { display: block; height: 100%; width: 0; background: var(--sky); }
#warnList { grid-column: 1 / 3; display: flex; flex-direction: column; gap: 4px; }
.wl { font-size: 12.5px; font-weight: 900; border-radius: 9px; border: 2px solid var(--ink); padding: 4px 8px; background: var(--lemon); }
.wl.danger { background: var(--red); color: #fff; animation: blink .5s steps(2) infinite; }
@keyframes blink { 50% { filter: brightness(1.35); } }
#pilotCard.danger { background: #ffe3e6; animation: shake .25s linear infinite; }
@keyframes shake { 0%,100% { transform: translate(0,0); } 25% { transform: translate(-2px,1px); } 75% { transform: translate(2px,-1px); } }
#stagesCard { position: absolute; right: 16px; top: calc(296px + env(safe-area-inset-top, 0px)); width: 250px; padding: 8px 10px; }
.stg { display: grid; grid-template-columns: 58px 1fr auto; gap: 6px; align-items: center; font-size: 12px; padding: 2px 0; }
.stg .fb { height: 10px; border: 2px solid var(--ink); border-radius: 6px; background: var(--line); overflow: hidden; }
.stg .fb i { display: block; height: 100%; background: var(--orange); }
.stg.cur { font-weight: 900; }
#apBadge { position: absolute; left: 50%; transform: translateX(-50%); top: calc(84px + env(safe-area-inset-top, 0px)); padding: 5px 12px; font-size: 12.5px; background: var(--sky); color: #fff; display: flex; gap: 10px; align-items: center; }
#apBadge button { background: #fff; border: 2px solid var(--ink); border-radius: 8px; padding: 2px 8px; font-size: 12px; }
#feed { position: absolute; left: 50%; transform: translateX(-50%); top: calc(120px + env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; }
.pop { font-family: var(--display); font-size: 24px; color: #fff; background: var(--pink); border: 3px solid var(--ink); border-radius: 14px; padding: 6px 16px; box-shadow: var(--hard); animation: popin .5s cubic-bezier(.2,1.6,.4,1) both, fadeout .5s ease-in 2.6s forwards; text-align: center; }
.pop small { display: block; font-family: var(--body); font-size: 13px; font-weight: 900; color: var(--lemon); }
.pop.first { background: var(--violet); }
.pop.bad { background: var(--red); }
@keyframes popin { from { transform: scale(.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes fadeout { to { opacity: 0; transform: translateY(-12px); } }
#hint { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(118px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: #fff; font-size: 15px; padding: 8px 16px; border-radius: 999px; white-space: nowrap; max-width: calc(100% - 32px); overflow: hidden; text-overflow: ellipsis; box-shadow: 0 3px 0 rgba(0,0,0,.25); }
#hint kbd { font-family: var(--display); background: var(--lemon); color: var(--ink); border-radius: 6px; padding: 0 6px; margin: 0 2px; }
#hint.good { background: var(--lime-d); }
#hint.bad { background: var(--red-d); }
#actionBar { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: repeat(10, minmax(0, 92px)); gap: 8px; width: min(1000px, calc(100% - 32px)); }
.act { position: relative; height: 90px; border: 3px solid var(--ink); border-radius: 16px; box-shadow: 0 5px 0 var(--ink); background: var(--paper); padding: 26px 4px 6px; font-size: 13.5px; line-height: 1.1; display: flex; align-items: center; justify-content: center; text-align: center; overflow: hidden; transition: transform .06s, box-shadow .06s; }
.act:active:not(.dis) { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
.act .key { position: absolute; top: 5px; left: 50%; transform: translateX(-50%); font-family: var(--display); font-size: 17px; width: 28px; height: 22px; line-height: 21px; border-radius: 7px; background: var(--ink); color: #fff; }
.act .lab { position: relative; z-index: 1; font-weight: 900; }
.act .fill { position: absolute; left: 0; bottom: 0; height: 5px; background: rgba(27,29,61,.35); width: 0; }
.act.gone { visibility: hidden; }
.act.dis { filter: grayscale(.6) opacity(.6); cursor: default; }
.act.hot { animation: pulse 0.9s ease-in-out infinite; }
@keyframes pulse { 0%,100% { box-shadow: 0 5px 0 var(--ink), 0 0 0 0 rgba(255,210,63,.9); } 50% { box-shadow: 0 5px 0 var(--ink), 0 0 0 7px rgba(255,210,63,0); } }
.act[data-n="1"] { background: var(--orange); color: #fff; }
.act[data-n="2"] { background: var(--pink); color: #fff; }
.act[data-n="3"] { background: var(--sky); color: #fff; }
.act[data-n="4"] { background: var(--violet); color: #fff; }
.act[data-n="5"] { background: var(--lime); color: #fff; }
.act[data-n="6"] { background: var(--lemon); }
.act[data-n="7"] { background: #ff9d4d; }
.act[data-n="8"] { background: var(--red); color: #fff; }
.act[data-n="9"] { background: #2b2f5e; color: #fff; }
.act[data-n="0"] { background: var(--paper); }
.act[data-n="1"] .key, .act[data-n="8"] .key, .act[data-n="9"] .key { background: #fff; color: var(--ink); }
.act.chute-bad { background: #b7c0cf !important; }
.act .tip { position: absolute; bottom: 7px; left: 0; right: 0; font-size: 10.5px; font-weight: 900; opacity: .9; }
.maplbl { position: absolute; transform: translate(-50%, 18px); font-size: 12.5px; font-weight: 900; color: #fff; background: rgba(27,29,61,.75); border: 2px solid rgba(255,255,255,.6); border-radius: 8px; padding: 1px 7px; pointer-events: none; white-space: nowrap; }
.maplbl.me { background: var(--orange); border-color: #fff; transform: translate(-50%, -34px); }
#btnPause { position: absolute; right: 16px; bottom: calc(118px + env(safe-area-inset-bottom, 0px)); width: 44px; height: 44px; }
#vignette { position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 0 0 rgba(255,59,79,0); transition: box-shadow .2s; }
#vignette.on { animation: vig .6s ease-in-out infinite; }
@keyframes vig { 0%,100% { box-shadow: inset 0 0 60px 10px rgba(255,59,79,.55); } 50% { box-shadow: inset 0 0 110px 30px rgba(255,59,79,.85); } }

/* ---------- overlays ---------- */
.overlay { position: absolute; inset: 0; background: rgba(12,18,51,.55); display: grid; place-items: center; padding: 16px; z-index: 20; }
.sheet { width: min(560px, 100%); max-height: calc(100% - 16px); overflow-y: auto; padding: 18px 20px 20px; background: var(--paper); border: 3px solid var(--ink); border-radius: 22px; box-shadow: 0 8px 0 var(--ink); animation: popin .45s cubic-bezier(.2,1.5,.4,1) both; }
.sheet h2 { font-family: var(--display); font-weight: 400; font-size: 34px; margin: 0; line-height: 1.05; text-wrap: balance; }
.sheet .subt { color: var(--ink-2); font-size: 14px; margin: 4px 0 12px; }
.reshead { display: flex; gap: 14px; align-items: center; margin-bottom: 8px; }
.reshead canvas { width: 92px; height: 92px; border-radius: 50%; border: 3px solid var(--ink); background: #bfe9ff; flex: none; }
.rrows { border-top: 2px dashed var(--line); }
.rrow { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; padding: 7px 2px; border-bottom: 2px dashed var(--line); font-size: 15px; align-items: baseline; animation: rowin .3s ease-out both; }
.rrow .rv { color: var(--ink-2); font-size: 13px; }

<script type="module">
// Rocket Roundtrip: a single-file cartoon idle rocket game. three.js loads from a CDN.
let THREE = null;
for (const url of ['https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js', 'https://unpkg.com/three@0.160.0/build/three.module.min.js']) {
  try { THREE = await import(url); break; } catch (e) { /* try the next CDN */ }
}
if (!THREE) {
  document.getElementById('loadMsg').textContent = 'Could not load the 3D engine (three.js). Check your internet connection and reload the page.';
  throw new Error('three.js failed to load');
}
// ==SIM-BEGIN==
// ---------------------------------------------------------------------------
//  SIMULATION CORE  (no DOM, no THREE — pure game logic)
//  Units: 1 sim unit ("u") is shown as 1 km of altitude; speeds show as u/s × 100 m/s.
// ---------------------------------------------------------------------------
const G0 = 2.5;            // surface gravity of Home (u/s²)
const KTH = G0 / 9.81;     // kN → t·u/s² (so TWR = kN / (9.81·t))
const KD = 1.0;            // drag constant
const SPD = 100;           // u/s → displayed m/s
const RS = 10;             // render units per sim unit
const TAU = Math.PI * 2;
const CH = 0.085;         // aero heating coefficient
const COOL = 0.11;         // hull cooling rate
const PAD_H = 0.15;        // launch pad height (u)
const WARPS = [1, 2, 5, 10, 50, 200];
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const wrapPi = a => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };

const BODIES = {
  home:  { id: 'home',  name: 'Home',  x: 0, y: 0, r: 1000, gm: 2.5e6, atm: 70, H: 8, rho0: 1, soi: Infinity },
  moon:  { id: 'moon',  name: 'Moon',  x: 6000 * Math.cos(2.35), y: 6000 * Math.sin(2.35), r: 250, gm: 26250, atm: 0, soi: 950 },
  rubra: { id: 'rubra', name: 'Rubra', x: 24000 * Math.cos(-0.62), y: 24000 * Math.sin(-0.62), r: 450, gm: 222750, atm: 40, H: 7, rho0: 0.35, soi: 7000 },
};
const BODY_LIST = [BODIES.home, BODIES.moon, BODIES.rubra];

function gravAt(x, y) {
  let gx = 0, gy = 0;
  for (const b of BODY_LIST) { const dx = b.x - x, dy = b.y - y, r2 = dx * dx + dy * dy, r = Math.sqrt(r2); gx += (b.gm / r2) * dx / r; gy += (b.gm / r2) * dy / r; }
  return { x: gx, y: gy };
}
function dominantBody(x, y) {
  for (const b of [BODIES.moon, BODIES.rubra]) {
    const dx = x - b.x, dy = y - b.y;
    if (dx * dx + dy * dy < b.soi * b.soi) return b;
  }
  return BODIES.home;
}
function densityAt(b, alt) {
  if (!b.atm || alt > b.atm) return 0;
  return b.rho0 * Math.exp(-Math.max(0, alt) / b.H);
}

// --- value noise (shared by sim for oceans and by renderer for terrain colours) ---
function hash3(x, y, z) { const h = Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453; return h - Math.floor(h); }
function vnoise3(x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const xf = x - xi, yf = y - yi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf);
  const c = (a, b, d) => hash3(xi + a, yi + b, zi + d);
  const x00 = lerp(c(0, 0, 0), c(1, 0, 0), u), x10 = lerp(c(0, 1, 0), c(1, 1, 0), u);
  const x01 = lerp(c(0, 0, 1), c(1, 0, 1), u), x11 = lerp(c(0, 1, 1), c(1, 1, 1), u);
  return lerp(lerp(x00, x10, v), lerp(x01, x11, v), w);
}
function fbm3(x, y, z) {
  let s = 0, a = 0.5, f = 1;
  for (let i = 0; i < 4; i++) { s += a * vnoise3(x * f, y * f, z * f); a *= 0.5; f *= 2.03; }
  return s / 0.9375;
}
// terrain height in [-1,1] for a unit-sphere direction on Home; < 0 means ocean
function homeTerrain(nx, ny, nz) {
  let h = (fbm3(nx * 2.2 + 11, ny * 2.2 + 3, nz * 2.2 + 7) - 0.5) * 2.4 + 0.05;
  const dx = nx, dy = ny - 1, dz = nz;
  h += 0.9 * Math.exp(-(dx * dx + dy * dy + dz * dz) * 30); // keep the launch site on dry land
  return h;
}
function isOcean(b, x, y) {
  if (b.id !== 'home') return false;
  const d = Math.hypot(x - b.x, y - b.y) || 1;
  return homeTerrain((x - b.x) / d, (y - b.y) / d, 0) < 0;
}

// ---------------------------------------------------------------------------
//  PARTS  (h / r are render sizes; m in tonnes; thrust in kN; ve in u/s)
// ---------------------------------------------------------------------------
const CATS = [
  { id: 'pod', name: 'Pods', cats: ['pod'] },
  { id: 'engine', name: 'Engines', cats: ['engine'] },

];
const PARTS = {
  // Pods -------------------------------------------------------------------

  pod_bubble: { cat: 'pod', name: 'Bubble Pod', desc: 'Glass dome, better padding.', cost: 700, req: 'clouds', m: 0.7, h: 2.4, r: 1.2, temp: 900, g: 9, impact: 0.15, power: 150, turn: 0.2, cda: 0.8, esc: 6, col: 0x9fe3ff },

  pod_titan:  { cat: 'pod', name: 'Titan Command Pod', desc: 'Orbital-grade armour & computers.', cost: 40000, req: 'orbit', m: 1.5, h: 3.2, r: 1.7, temp: 1700, g: 14, impact: 0.22, power: 1000, turn: 0.8, cda: 1.3, esc: 8, col: 0xf2f4ff },
  pod_star:   { cat: 'pod', name: 'Starliner Deluxe', desc: 'Luxury deep-space cruiser.', cost: 300000, req: 'moonland', m: 2.0, h: 3.6, r: 2.0, temp: 2500, g: 18, impact: 0.28, power: 2500, turn: 1.2, cda: 1.6, esc: 9, col: 0xfff3c4 },
  // Engines (solid = fuel built in) -----------------------------------------
  srb_fire:   { cat: 'engine', kind: 'solid', name: 'Firecracker', desc: 'Solid motor. Lights once, burns till empty.', cost: 0, m: 0.2, fuel: 1.1, thrust: 27, ve: 17, h: 3, r: 0.7, col: 0xff5a36 },

  liq_sparrow:{ cat: 'engine', kind: 'liquid', name: 'Sparrow', desc: 'Small liquid engine. Can switch off & relight. Needs tanks.', cost: 900, req: 'clouds', m: 0.25, thrust: 55, ve: 29, veVac: 32, h: 1.2, r: 0.8, col: 0x55607a },
  liq_swift:  { cat: 'engine', kind: 'liquid', name: 'Swift', desc: 'Reliable workhorse liquid engine.', cost: 4500, req: 'strato', m: 0.6, thrust: 160, ve: 31, veVac: 34, h: 1.6, r: 1.1, col: 0x4a5572 },
  liq_vesper:  { cat: 'engine', kind: 'liquid', name: 'Vesper Vacuum', desc: 'Weak in air, superb in space.', cost: 14000, req: 'space', m: 0.4, thrust: 75, ve: 18, veVac: 46, h: 2.0, r: 1.0, col: 0x3d4a66 },
  liq_mammoth:{ cat: 'engine', kind: 'liquid', name: 'Mammoth', desc: 'Huge first-stage liquid engine.', cost: 45000, req: 'orbit', m: 1.8, thrust: 520, ve: 32, veVac: 35, h: 2.4, r: 1.6, col: 0x39435e },
  liq_behemoth:{cat: 'engine', kind: 'liquid', name: 'Behemoth', desc: 'The biggest bell in the shop.', cost: 250000, req: 'moon', m: 4.5, thrust: 1500, ve: 33, veVac: 36, h: 3.2, r: 2.4, col: 0x2e3650 },

function upCost(u, lvl) { return Math.round(u.base * Math.pow(u.grow, lvl)); }
function passiveBase(l) { return l <= 0 ? 0 : 0.4 * l * Math.pow(1.13, l); }
function offlineEff(l) { return Math.min(1, 0.4 + l * 0.08); }
function fmtNum(n) {
  if (!isFinite(n)) return '∞';
  const a = Math.abs(n);
  if (a >= 1e12) return (n / 1e12).toFixed(2) + 'T';
  if (a >= 1e9) return (n / 1e9).toFixed(2) + 'B';
  if (a >= 1e6) return (n / 1e6).toFixed(2) + 'M';
  if (a >= 1e4) return Math.round(n).toLocaleString('en-US');
  if (a >= 100) return Math.round(n).toLocaleString('en-US');
  if (a >= 10) return n.toFixed(1).replace(/\.0$/, '');
  return n.toFixed(2).replace(/\.?0+$/, '') || '0';
}

function makeMods(save) {
  const u = id => (save.up && save.up[id]) || 0;
  return {
    thrust: 1 + 0.08 * u('thrust'),
    fuel: 1 + 0.10 * u('fuel'),
    dry: Math.max(0.5, 1 - 0.05 * u('light')),
    heat: 1 + 0.12 * u('heat'),
    chute: 1 + 0.10 * u('chute'), chuteDrag: 1 + 0.08 * u('chute'),
    gtol: 1 + 0.10 * u('pilot'), health: 100 + 15 * u('pilot'),
    padMax: PAD_LEVELS[Math.min(u('pad'), PAD_LEVELS.length - 1)],
    pay: {
      alt: 1 + 0.25 * u('p_alt'), speed: 1 + 0.25 * u('p_speed'), space: 1 + 0.25 * u('p_space'),
      orbit: 1 + 0.5 * u('p_orbit'), dist: 1 + 0.25 * u('p_dist'), mile: 1 + 0.2 * u('p_mile'), land: 1 + 0.3 * u('p_land'),
    },
    all: 1 + 0.1 * (save.stars || 0),
    maxWarp: [10, 50, 200][Math.min(2, u('warp'))],
    satMul: 1 + 0.5 * u('satnet'),
  };
}

// ---------------------------------------------------------------------------
//  ROCKET DESIGN → CRAFT
//  design = { nose, chutes[], pod, shield, gear[], extras[], stages:[{deco,tanks[],engine,boost:{id,n},fins}] }
//  stages[0] sits right under the pod; the LAST stage is the bottom one and fires first.
// ---------------------------------------------------------------------------
function defaultDesign() {
  return { nose: null, chutes: ['chute_hanky'], pod: 'pod_tin', shield: null, gear: [], extras: [],
    stages: [{ deco: 'deco_bolt', tanks: [], engine: 'srb_fire', boost: null, fins: null }] };
}
function cloneDesign(d) { return JSON.parse(JSON.stringify(d)); }

function buildCraft(design, mods) {
  const P = id => (id ? PARTS[id] : null);
  const pod = P(design.pod) || PARTS.pod_tin;
  const nose = P(design.nose);
  const shield = P(design.shield);
  const gear = (design.gear || []).map(P).filter(Boolean);
  const extras = (design.extras || []).map(P).filter(Boolean);
  const chutes = (design.chutes || []).map(P).filter(Boolean);
  const top = {
    pod, nose, noseOn: !!nose, shield, abl: shield ? shield.abl * mods.heat : 0, ablMax: shield ? shield.abl * mods.heat : 0,
    chutes: chutes.map(def => ({ def, st: 'packed', dep: 0 })),
    legs: gear.find(g => g.kind === 'legs') || null, bags: gear.find(g => g.kind === 'bags') || null, retro: gear.find(g => g.kind === 'retro') || null,
    gearDown: false, bagsPopped: false, retroFired: false, retroT: 0,
    extras, power: pod.power, regen: 0, turn: pod.turn, stab: 0, labs: 0, cargo: 0, tourists: 0,
  };
  for (const e of extras) {
    if (e.power) top.power += e.power;
    if (e.regen) top.regen += e.regen;
    if (e.turn) top.turn += e.turn;
    if (e.stab) top.stab += e.stab;
    if (e.kind === 'science') top.labs++;
    if (e.kind === 'cargo') top.cargo++;
    if (e.kind === 'tourist') top.tourists++;
  }
  let dry = pod.m + (nose ? nose.m : 0) + (shield ? shield.m : 0);
  for (const c of chutes) dry += c.m;
  for (const g of gear) dry += g.m;
  for (const e of extras) dry += e.m - (e.sat || 0);
  top.dry = dry * mods.dry;
  top.satMass = top.cargo * 1.0; // satellites are payload: not reduced by lighter parts
  top.noseMass = nose ? nose.m * mods.dry : 0;
  top.h = pod.h + (shield ? shield.h : 0) + (chutes.length ? 0.6 : 0) + (nose ? nose.h : 0);
  for (const e of extras) if (e.h) top.h += e.h;
  top.rad = pod.r;

  const stages = (design.stages || []).map(s => {
    const deco = P(s.deco) || PARTS.deco_bolt;
    const eng = P(s.engine);
    const tanks = (s.tanks || []).map(P).filter(Boolean);
    const fins = P(s.fins);
    let sdry = deco.m + (eng ? eng.m : 0) + (fins ? fins.m : 0);
    let fuel = 0;
    for (const t of tanks) { sdry += t.m; fuel += t.fuel; }
    let solidFuel = 0;
    if (eng && eng.kind === 'solid') solidFuel = eng.fuel;
    const st = {
      deco, eng, tanks, fins,
      dry: sdry * mods.dry,
      fuel: (eng && eng.kind === 'solid' ? solidFuel : fuel) * mods.fuel,
      deadFuel: (eng && eng.kind === 'solid' ? fuel : 0) * mods.fuel, // tanks on a solid stage are useless
      lit: false,
      h: deco.h + (eng ? eng.h : 0) + tanks.reduce((a, t) => a + t.h, 0),
      rad: Math.max(eng ? eng.r : 0.5, ...tanks.map(t => t.r)),
      bst: null,
    };
    if (!eng || eng.kind !== 'solid') st.fuel = fuel * mods.fuel;
    st.fuelMax = st.fuel;
    if (s.boost && P(s.boost.id)) {
      const b = P(s.boost.id);
      st.bst = { def: b, n: s.boost.n || 2, dry: b.m * mods.dry, fuel: b.fuel * mods.fuel, fuelMax: b.fuel * mods.fuel, lit: false, dropped: false };
    }
    return st;
  });
  return { top, stages };
}

  sfx(name) {

      case 'mile': [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.16, 'triangle', 0.18, 0, i * 0.08)); break;
      case 'ignite': this.noise(0.8, 1800, 200, 0.5); this.tone(90, 0.6, 'sawtooth', 0.12, 0.5); break;
      case 'stage': this.noise(0.25, 2400, 300, 0.45, 'bandpass'); this.tone(140, 0.2, 'square', 0.15, 0.5); break;
      case 'boom': this.noise(1.6, 1400, 60, 0.9); this.tone(70, 1.0, 'sine', 0.5, 0.4); break;
      case 'chute': this.noise(0.35, 600, 2000, 0.35, 'bandpass'); this.tone(200, 0.3, 'sine', 0.2, 0.5, 0.05); break;
      case 'rip': this.noise(0.4, 3000, 800, 0.4, 'highpass'); break;
      case 'land': this.noise(0.3, 600, 80, 0.5); this.tone(80, 0.25, 'sine', 0.4, 0.6); break;
      case 'boing': this.tone(180, 0.35, 'sine', 0.3, 2.5); break;
      case 'warn': this.tone(880, 0.12, 'square', 0.09); this.tone(660, 0.12, 'square', 0.09, 0, 0.14); break;
      case 'gear': this.tone(300, 0.08, 'square', 0.1); this.tone(220, 0.1, 'square', 0.1, 0, 0.1); break;
      case 'eject': this.noise(0.9, 2500, 300, 0.6); this.tone(400, 0.5, 'sawtooth', 0.15, 2); break;
      case 'fanfare': [523, 659, 784, 1047, 784, 1047].forEach((f, i) => this.tone(f, 0.22, 'triangle', 0.2, 0, i * 0.11)); break;
      case 'sad': [392, 370, 349, 262].forEach((f, i) => this.tone(f, 0.35, 'triangle', 0.18, 0, i * 0.22)); break;
    }

};

function partStats(p) {
  const out = [];
  const t = (m) => (m < 1 ? m.toFixed(2) : m.toFixed(1)) + ' t';
  switch (p.cat) {
    case 'pod': out.push(`Heat ${p.temp}°C`, `${p.g} G`, `Lands ≤ ${Math.round(p.impact * SPD)} m/s`, `Power ${p.power}`, t(p.m)); break;
    case 'engine': out.push(`${p.thrust} kN`, `Exhaust ${Math.round((p.veVac || p.ve) * SPD)} m/s`);
      if (p.kind === 'solid') out.push(`Burn ${(p.fuel / (p.thrust * KTH / p.ve)).toFixed(1)} s`, t(p.m + p.fuel)); else out.push(t(p.m));
      if (p.kind === 'ion') out.push(`-${p.pdraw} power/s`); break;
    case 'booster': out.push(`2 × ${p.thrust} kN`, `${t(p.m + p.fuel)} each`, `Burn ${(p.fuel / (p.thrust * KTH / p.ve)).toFixed(1)} s`); break;
    case 'tank': out.push(`${p.fuel} t fuel`, `${t(p.m + p.fuel)} full`); break;
    case 'chute': out.push(`Opens < ${Math.round(p.vmax * SPD)} m/s`, `Slows 1 t to ${Math.round(Math.sqrt(G0 / (KD * p.area)) * SPD)} m/s`, t(p.m)); break;
    case 'shield': out.push(`Blocks ${Math.round(p.prot * 100)}% heat`, t(p.m)); break;
    case 'nose': out.push(`-${Math.round(p.drag * 100)}% drag`, p.escMul > 1 ? `Eject ×${p.escMul}` : `-${Math.round(p.heat * 100)}% ascent heat`, t(p.m)); break;
    case 'fin': out.push(`+${p.stab} stability`, t(p.m)); break;
    case 'deco': out.push(p.kick ? `+${Math.round(p.kick * SPD)} m/s kick` : 'Separator', t(p.m)); break;
    case 'gear': if (p.kind === 'legs') out.push(`Lands ≤ ${Math.round(p.impact * SPD)} m/s`); else if (p.kind === 'bags') out.push(`+${Math.round(p.impact * SPD)} m/s landing`); else out.push(`-${Math.round(p.imp * SPD)} m/s per ton`); out.push(t(p.m)); break;
    case 'extra': if (p.power) out.push(`+${p.power} power`); if (p.regen) out.push(`+${p.regen}/s in space`); if (p.turn) out.push(`+turn speed`); if (p.kind === 'science') out.push('$4/s in space'); if (p.kind === 'cargo') out.push('Satellite: $2,500 + $1/s'); if (p.kind === 'tourist') out.push('+25% pay'); out.push(t(p.m)); break;
  }
  return out;
}

// ---------------- design editing ----------------
function design() { return save.design; }
function bottomIdx() { return design().stages.length - 1; }
function curStageIdx() { const d = design(); if (!d.stages.length) return -1; if (selStage < 0 || selStage >= d.stages.length) selStage = d.stages.length - 1; return selStage; }
function ensureStage() { const d = design(); if (!d.stages.length) { d.stages.push({ deco: 'deco_bolt', tanks: [], engine: null, boost: null, fins: null }); selStage = 0; } return d.stages[curStageIdx()]; }
function addPart(id) {
  const p = PARTS[id], d = design();
  switch (p.cat) {
    case 'pod': d.pod = id; break;
    case 'nose': d.nose = id; break;
    case 'shield': d.shield = id; break;
    case 'chute': if (d.chutes.length >= 4) return toast('Max 4 parachutes'); d.chutes.push(id); break;
    case 'gear': d.gear = d.gear.filter(g => PARTS[g].kind !== p.kind); d.gear.push(id); break;
    case 'extra': if (d.extras.length >= 6) return toast('Max 6 extras'); d.extras.push(id); break;
    case 'engine': ensureStage().engine = id; break;
    case 'tank': { const s = ensureStage(); if (s.tanks.length >= 5) return toast('Max 5 tanks per stage'); s.tanks.push(id); break; }
    case 'booster': { const s = ensureStage(); if (s.boost && s.boost.id === id) { if (s.boost.n >= 6) return toast('Max 6 boosters per stage'); s.boost.n += 2; } else s.boost = { id, n: 2 }; break; }
    case 'fin': ensureStage().fins = id; break;

  }
  AudioSys.sfx('click');
  designChanged();
}

function processEvents() {

      case 'stage': {
        const info = model.stages.get(e.st);
        if (info) { detachToDebris(info.group, e.st, 0.6); model.stages.delete(e.st); shiftModel(e.st.h); }
        AudioSys.sfx('stage'); camShake = Math.max(camShake, 0.3);

        const info = e.st && model.stages.get(e.st);

      case 'chuteRip': AudioSys.sfx('rip'); popup('CHUTE RIPPED!', 'Too fast! Open it slower next time', 'bad'); for (const c of model.chutes) if (c.c.st === 'ripped' && c.g.parent === model.top) detachToDebris(c.g, null, 2, 0, true); break;
      case 'chuteCut': for (const c of model.chutes) if (c.c.st === 'cut' && c.g.parent === model.top) detachToDebris(c.g, null, 0.1, 0, true); break;
      case 'noseDrop': if (model.nose) { detachToDebris(model.nose, null, 1.5, 0); model.nose = null; } break;

function detachToDebris(g, st, push, ang = 0, isChute = false) {
  g.updateMatrixWorld(true);
  const wp = new V3(), wq = new THREE.Quaternion();
  g.getWorldPosition(wp); g.getWorldQuaternion(wq);
  g.parent.remove(g);
  world.add(g);
  g.position.copy(wp).sub(world.position);
  g.quaternion.copy(wq);
  const f = flight;
  const side = new V3(Math.cos(ang), 0, Math.sin(ang)).applyQuaternion(wq);
  const axis = new V3(0, -1, 0).applyQuaternion(wq);
  const pv = isChute ? axis.clone().multiplyScalar(-push) : side.multiplyScalar(push).add(axis.multiplyScalar(push * 0.4));

function updateDebris(dt, warp) {
  const sdt = Math.min(dt * warp, 2);
  for (let i = debris.length - 1; i >= 0; i--) {
    const d = debris[i];
    d.t += dt;
    const b = dominantBody(d.x, d.y);
    const dx = d.x - b.x, dy = d.y - b.y, r = Math.hypot(dx, dy);
    const alt = r - b.r;
    const rho = densityAt(b, alt);
    const n = Math.max(1, Math.ceil(sdt / 0.05)), h = sdt / n;
    for (let k = 0; k < n; k++) {
      const rr = Math.hypot(d.x - b.x, d.y - b.y);
      const g = b.gm / (rr * rr);
      d.vx -= (d.x - b.x) / rr * g * h; d.vy -= (d.y - b.y) / rr * g * h;
      const v = Math.hypot(d.vx, d.vy);
      const drag = rho * v * (d.chute ? 40 : 0.6);
      d.vx -= d.vx * Math.min(1, drag * h); d.vy -= d.vy * Math.min(1, drag * h);
      d.x += d.vx * h; d.y += d.vy * h;
    }
    d.z += d.vz * dt; d.vz *= 0.98;
    d.g.position.set(d.x * RS, d.y * RS, d.z);
    d.g.rotateZ(d.spin * dt); if (!d.chute) d.g.rotateX(d.spin * 0.4 * dt);
    const r2 = Math.hypot(d.x - b.x, d.y - b.y);
    if (r2 < b.r || d.t > 45 || (d.chute && d.t > 14)) {
      if (r2 < b.r && d.big && Math.hypot(d.vx, d.vy) > 0.3 && Math.abs(d.x * RS - flight.x * RS) < 4000) explosion(d.g.position.clone(), 0.8);
      world.remove(d.g); debris.splice(i, 1);
    }
  }
}

  const r = Math.max(2.2, f.top.pod.r * 1.8);
  plasma.position.copy(v).multiplyScalar(r * 0.3);
  plasma.quaternion.setFromUnitVectors(new V3(0, -1, 0), v);
  plasma.scale.set(r * (1 + k * 0.6), r * (1.4 + k * 2.2) * (0.9 + Math.random() * 0.2), r * (1 + k * 0.6));
  plasma.material.opacity = k * 0.8;
  plasma.material.color.setHSL(0.06 - k * 0.06, 1, 0.55 + k * 0.1);
  if (Math.random() < k) fireball(v.clone().multiplyScalar(-r * 0.5).add(new V3((Math.random() - 0.5) * r, (Math.random() - 0.5) * r, (Math.random() - 0.5) * r)).sub(world.position), v.clone().multiplyScalar(-40 - Math.random() * 40), 0.6 + Math.random() * 0.8, 0.35);
}

// ---------------- camera ----------------
// map view: when the player asks for it, or automatically while cruising far from everything
function mapWanted() {
  if (camMode === 'map') return true;
  if (camMode === 'rocket' || !flight) return false;
  return flight.launched && !flight.landed && flight.alive && flight.alt > 900;
}
function updateCamera(dt) {
  const w = window.innerWidth, h = window.innerHeight;
  if (mode === 'hangar' || mode === 'loading') {
    camState.yaw += dt * 0.1;
    const H = hangarModel ? hangarModel.height : 10;
    const d = Math.max(17, H * 1.45 + 9) * (w <= 860 ? (w < h ? 2.1 : 1.5) : 1);
    const tgt = new V3(0, H * 0.5, 0);
    camera.position.set(tgt.x + Math.sin(camState.yaw) * d, tgt.y + d * 0.16 + 2, tgt.z + Math.cos(camState.yaw) * d);
    camera.up.set(0, 1, 0); camera.lookAt(tgt);
    if (w <= 860) camera.setViewOffset(w, h, 0, h * 0.24, w, h); else camera.clearViewOffset();
    return;
  }
  camera.clearViewOffset();
  const f = flight;
  const dom = f.dom;
  const up = new V3(f.x - dom.x, f.y - dom.y, 0).normalize();
  const east = new V3(up.y, -up.x, 0);
  const axis = new V3(Math.cos(f.att), Math.sin(f.att), 0);
  const H = Math.max(4, model.height);
  const chuteOpen = model.chutes.some(c => c.g.visible && c.g.parent === model.top);
  const chuteLift = chuteOpen ? Math.max(...model.chutes.filter(c => c.g.visible && c.g.parent === model.top).map(c => c.lift)) : 0;
  const center = axis.clone().multiplyScalar(H * 0.45).add(up.clone().multiplyScalar(chuteLift * 0.45));
  const base = Math.max(20, H * 1.4 + 10) + chuteLift * 1.1;
  const alt = Math.max(0, f.alt);
  let D, elev;
  const bigBody = dom.atm > 0 || dom.id === 'home';
  if (alt < 70 && bigBody) { D = base * (1 + 1.8 * smooth(0, 60, alt)); elev = lerp(0.1, 0.45, smooth(8, 70, alt)); }
  else { D = base * 2.8 + Math.min(alt, 500) * 0.45; elev = dom.id === 'home' ? 0.55 : 0.4; }
  if (f.landed) { D = base * 1.15; elev = 0.12; }
  if (!f.alive && f.exploded) { D = Math.max(D, 60); }
  const dir = up.clone().multiplyScalar(elev).add(east.clone().multiplyScalar(0.34)).add(new V3(0, 0, 1)).normalize();
  const offRocket = dir.multiplyScalar(D);
  // map view framing
  const mapB = mapWanted() ? 1 : 0;
  camState.mapBlend += (mapB - camState.mapBlend) * Math.min(1, dt * 3);
  let pos = center.clone().add(offRocket), look = center.clone(), camUp = up.clone();
  if (camState.mapBlend > 0.001) {
    const pts = [new V3(0, 0, 0), new V3((dom.x - f.x) * RS, (dom.y - f.y) * RS, 0)];
    if (lastPred) for (let i = 0; i < lastPred.pts.length; i += 40) pts.push(new V3((lastPred.pts[i] - f.x) * RS, (lastPred.pts[i + 1] - f.y) * RS, 0));
    if (lastPred && lastPred.encounter) { const b = BODIES[lastPred.encounter]; pts.push(new V3((b.x - f.x) * RS, (b.y - f.y) * RS, 0)); }
    const bb = new THREE.Box3().setFromPoints(pts);
    const c = bb.getCenter(new V3()), sz = bb.getSize(new V3());
    const rad = Math.max(sz.x, sz.y) * 0.62 + dom.r * RS * 0.4 + 80;
    const Dm = rad / Math.tan((camera.fov * Math.PI / 180) / 2) * (w < h ? h / w : 1);
    const mp = c.clone().add(new V3(0, -Dm * 0.3, Dm));
    const t = camState.mapBlend;
    pos.lerp(mp, t); look.lerp(c, t); camUp.lerp(new V3(0, 1, 0), t).normalize();
  }
  if (!camState.init) { camState.off.copy(pos); camState.look.copy(look); camState.up.copy(camUp); camState.init = true; }
  const k = 1 - Math.exp(-dt * (mapB ? 4 : 5));
  camState.off.lerp(pos, k); camState.look.lerp(look, k); camState.up.lerp(camUp, k).normalize();
  camera.position.copy(camState.off);
  if (camShake > 0.01) { camera.position.add(new V3((Math.random() - 0.5), (Math.random() - 0.5), (Math.random() - 0.5)).multiplyScalar(camShake * 2)); camShake *= Math.max(0, 1 - dt * 3); }
  if (f.thrusting && f.alive && f.alt < 5) camShake = Math.max(camShake, 0.12);
  camera.up.copy(camState.up);
  camera.lookAt(camState.look);
  // ship marker in map view
  pathMarkers.ship.visible = camState.mapBlend > 0.5;
  pathMarkers.ship.position.set(f.x * RS, f.y * RS, 0);
}
function updateSky(dt) {
  let camAlt = 0, nearOther = false;
  if (mode === 'flight' && flight) {
    const cx = flight.x + camera.position.x / RS, cy = flight.y + camera.position.y / RS;
    camAlt = Math.hypot(cx, cy) - BODIES.home.r;
    nearOther = flight.dom.id !== 'home';
  }
  const stops = [[0, 0x8fdcff], [6, 0x5fbaff], [22, 0x2c6fe0], [45, 0x10297a], [70, 0x04061a]];
  let col = new THREE.Color(stops[stops.length - 1][1]);
  for (let i = 0; i < stops.length - 1; i++) {
    if (camAlt <= stops[i + 1][0]) { const t = clamp((camAlt - stops[i][0]) / (stops[i + 1][0] - stops[i][0]), 0, 1); col = new THREE.Color(stops[i][1]).lerp(new THREE.Color(stops[i + 1][1]), t); break; }
  }
  if (nearOther) col.set(0x04061a);
  const mapK = camState.mapBlend || 0;
  col.lerp(new THREE.Color(0x04061a), mapK);
  scene.background = col;
  const fogK = nearOther ? 0 : 1 - smooth(20, 75, camAlt);
  scene.fog.color.copy(col);
  scene.fog.near = 500 + camAlt * 120;
  scene.fog.far = fogK * (1 - mapK) > 0.02 ? 5500 + camAlt * camAlt * 25 : 1e12;
  starMat.opacity = Math.max(smooth(18, 65, camAlt), nearOther ? 1 : 0, mapK);
  hemi.intensity = lerp(1.15, 0.55, smooth(20, 80, camAlt));
  bodyMeshes.homeAtm.material.uniforms.op.value = Math.max(smooth(20, 90, camAlt), mapK) * 0.9;
  skyGroup.position.copy(camera.position);
  sunSprite.material.opacity = 0.35 + 0.65 * smooth(10, 70, camAlt);
  // backdrop Moon / Rubra fade out once the real ones are close or the map is open
  const far = (b) => { if (!flight) return 1; const d = Math.hypot(flight.x - b.x, flight.y - b.y); return smooth(b.r * 6, b.r * 12, d); };
  skyMoon.material.opacity = (1 - mapK) * far(BODIES.moon);
  skyRubra.material.opacity = (1 - mapK) * far(BODIES.rubra) * (0.55 + 0.45 * smooth(10, 60, camAlt));
  updateMapLabels(mapK);
}
const mapLabels = {};
function updateMapLabels(k) {
  const show = mode === 'flight' && flight && k > 0.6;
  for (const b of BODY_LIST) {
    let e = mapLabels[b.id];
    if (!e) { e = mapLabels[b.id] = el('div', 'maplbl', b.name); $('hud').appendChild(e); }
    if (!show) { e.hidden = true; continue; }
    const p = new V3((b.x - flight.x) * RS, (b.y - flight.y) * RS, 0).project(camera);
    const vis = p.z < 1 && Math.abs(p.x) < 1.1 && Math.abs(p.y) < 1.1;
    e.hidden = !vis;
    if (vis) { e.style.left = ((p.x + 1) / 2 * window.innerWidth) + 'px'; e.style.top = ((1 - p.y) / 2 * window.innerHeight) + 'px'; }
  }
  let me = mapLabels.me;
  if (!me) { me = mapLabels.me = el('div', 'maplbl me', 'You'); $('hud').appendChild(me); }
  me.hidden = !show;
  if (show) { const p = new V3(0, 0, 0).project(camera); me.style.left = ((p.x + 1) / 2 * window.innerWidth) + 'px'; me.style.top = ((1 - p.y) / 2 * window.innerHeight) + 'px'; }
}

// ---------------- results ----------------
const DEATH_TIPS = [
  [/Burned/, 'Add a heat shield (Heat & Aero) and come home capsule-first. Tougher Heat Shields in Upgrades help too.'],
  [/Overheated/, 'Too fast, too low. A nose cone cuts the heat; so does less thrust in the lower air (liquid engines can be cut with [3]).'],
  [/Crashed into Moon|Crashed into Rubra/, 'No air there: point retro [4] and burn [3] to slow down before touchdown, and deploy legs [6].'],
  [/Crashed|too hard|Hard landing/, 'Open the parachute [5] once you are below its safe speed. Legs [6], airbags and retro rockets [7] soften the touchdown.'],
  [/shook/, 'Add fins for stability, or cut the engine [3] while the air is thick.'],
  [/G-forces/, 'Pilot Training raises the G limit. Big thrust on a light rocket squashes the pilot.'],
  [/power/, 'Add batteries or solar panels for long trips in space.'],
];
function scheduleResults() {
  const f = flight;
  const delay = f.result === 'dead' ? 2800 : f.result === 'landed' ? 1400 : 700;
  clearTimeout(resultsTimer);
  resultsTimer = setTimeout(showResults, delay);
}
function showResults() {
  const f = flight; if (!f) return;
  const res = f.result;
  const E = computeEarnings(f, true);
  const dead = res === 'dead';
  const scrub = res === 'scrub';
  let total = dead || scrub ? 0 : E.total;
  // bookkeeping
  const recAlt = !dead && f.stats.maxAlt > save.best.alt, recSpd = !dead && f.stats.topSpeed > save.best.speed;
  if (!dead && !scrub) {
    earn(total);
    save.firsts = Object.assign({}, save.firsts, f.firsts);
    for (const k in f.firsts) save.ever[k] = true;
    save.best.alt = Math.max(save.best.alt, f.stats.maxAlt); save.best.speed = Math.max(save.best.speed, f.stats.topSpeed);
    save.best.orbits = Math.max(save.best.orbits, f.stats.orbits); save.best.space = Math.max(save.best.space, f.stats.spaceT);
    save.sats += f.stats.sats;
    save.stats.safe++; save.pilotFlights++;
  } else if (dead) {
    save.stats.lost++; save.memorial.push(pilotName()); save.pilotIdx++; save.pilotFlights = 0;
  }
  saveGame();
  const look = pilotLook(dead ? save.pilotIdx - 1 : save.pilotIdx);
  const title = dead ? 'Pilot lost' : res === 'rescued' ? 'Rescued!' : scrub ? 'Launch scrubbed' : f.stats.landing === 'perfect' ? 'Perfect mission!' : 'Mission complete!';
  const sub = dead ? `${esc(f.deathCause || 'Something went wrong')}. The flight earns nothing.` : res === 'rescued' ? 'A rescue crew brought the pilot home. The rescue fee takes 75% of the pay.' : scrub ? 'The rocket never left the pad. The pilot is safe, but nothing was earned.' : `${esc(pilotName())} is home safe after ${fmtTime(f.t)}.`;
  const m = $('results');
  let rows = '';
  let i = 0;
  for (const r of E.rows) {
    if (r.amt < 0.5 && ['orbit', 'orbitT', 'orbits', 'sci', 'sat', 'tour'].includes(r.k)) continue;
    const rec = (r.k === 'alt' && recAlt) || (r.k === 'speed' && recSpd) ? '<span class="rec">NEW RECORD</span>' : '';
    let det = '';
    if (r.k === 'mile' && f.stats.miles.length) det = `<div class="mdet">${f.stats.miles.filter(x => x.amount > 0).map(x => esc(x.name) + (x.first ? ' (first!)' : '')).join(' · ')}</div>`;
    rows += `<div class="rrow ${r.amt < 0.5 ? 'zero' : ''}" style="animation-delay:${i * 0.09}s"><span class="rl">${esc(r.label)}${rec}</span><span class="rv num">${esc(r.val)}</span><span class="ra num">${money(r.amt)}</span>${det}</div>`;
    i++;
  }
  const multTxt = E.mult > 1 ? `<div class="rrow" style="animation-delay:${i * 0.09}s"><span class="rl">Agency stars ★ ${save.stars}</span><span class="rv"></span><span class="ra num">×${E.mult.toFixed(1)}</span></div>` : '';
  const tip = dead ? (DEATH_TIPS.find(t => t[0].test(f.deathCause || '')) || [0, 'Watch the pilot card: it warns you before things go wrong.'])[1] : null;
  const relaunch = save.autoRelaunch && save.up.a_relaunch && f.plan !== 'manual';
  m.innerHTML = `<div class="sheet ${dead ? 'dead' : ''}">
    <div class="reshead"><canvas id="resFace" width="184" height="184"></canvas><div><h2>${title}</h2><p class="subt">${sub}</p></div></div>
    <div class="rrows">${rows}${multTxt}</div>
    <div class="rtotal"><span class="label">${dead ? 'Paid out' : 'Total earned'}</span><b class="num" id="resTotal">$0</b></div>
    ${dead ? '<div style="text-align:center"><span class="stamp">PILOT LOST — $0</span></div>' : ''}
    ${tip ? `<div class="tipbox"><b>Tip:</b> ${esc(tip)}</div>` : ''}
    ${relaunch ? '<div class="tipbox" id="relaunchNote">Auto-relaunch in <b id="rlCount">5</b>s</div>' : ''}
    <div class="btns"><button class="btn" id="btnHangar"><span class="num">[1]</span> Hangar</button><button class="btn orange" id="btnAgain"><span class="num">[2]</span> Fly again</button></div>
  </div>`;
  m.hidden = false;
  drawFace($('resFace').getContext('2d'), 184, dead ? 'dead' : res === 'landed' && f.stats.landing === 'perfect' ? 'excited' : scrub ? 'worried' : 'happy', look, 0);
  const tEl = $('resTotal');
  const t0 = performance.now(), dur = 1200 + Math.min(1500, i * 90);
  const shown = dead ? E.total : total;
  const tick = () => {
    const k = clamp((performance.now() - t0) / dur, 0, 1);
    const e = 1 - Math.pow(1 - k, 3);
    tEl.textContent = dead ? money(0) : money(shown * e);
    if (k < 1 && !m.hidden) requestAnimationFrame(tick);
  };
  tick();
  AudioSys.sfx(dead ? 'sad' : total > 0 ? 'coin' : 'click');
  $('btnHangar').onclick = () => { closeResults(); enterHangar(); };
  $('btnAgain').onclick = () => { closeResults(); enterHangar(); startFlight(); };
  if (relaunch) {
    let n = 5;
    const step = () => { n--; const c = $('rlCount'); if (c) c.textContent = n; if (n <= 0) { closeResults(); enterHangar(); if (rocketStats(design(), mods).ok) startFlight(); } else relaunchTimer = setTimeout(step, 1000); };
    relaunchTimer = setTimeout(step, 1000);
  }
}
function closeResults() { clearTimeout(relaunchTimer); relaunchTimer = null; $('results').hidden = true; }

// ---------------- pause ----------------
let paused = false;
function openPause() {
  if (mode !== 'flight' || !flight || flight.over) return;
  paused = true;
  const m = $('modal');
  m.innerHTML = `<div class="sheet"><h2>Paused</h2><p class="subt">Leaving now ends the flight with no pay. The pilot walks home safe.</p>
    <div class="tipbox"><b>Controls:</b> every action is a numbered button. Tap it, or press its number key on a keyboard.</div>
    <div class="btns"><button class="btn orange" id="pResume">Resume</button><button class="btn" id="pSound">${save.sound ? 'Mute sound' : 'Unmute sound'}</button><button class="btn red" id="pQuit">Abandon flight</button></div></div>`;
  m.hidden = false;
  $('pResume').onclick = closePause;
  $('pSound').onclick = () => { toggleSound(); $('pSound').textContent = save.sound ? 'Mute sound' : 'Unmute sound'; };
  $('pQuit').onclick = () => { closePause(); flight = null; enterHangar(); };
}
function closePause() { paused = false; $('modal').hidden = true; }

// ---------------- offline earnings ----------------
function offlineCheck() {
  const now = Date.now();
  const away = Math.max(0, (now - (save.lastTime || now)) / 1000);
  if (away < 5) return;
  const lvl = save.up.night || 0;
  const capH = 4 + lvl * 2;
  const secs = Math.min(away, capH * 3600);
  const amt = passiveRate() * secs * offlineEff(lvl);
  if (amt < 1) return;
  earn(amt);
  saveGame();
  if (away < 60 || mode === 'flight' || !$('modal').hidden || !$('results').hidden) { if (amt >= 1) toast(`While you were away: +${money(amt)}`); return; }
  const m = $('modal');
  const look = pilotLook(save.pilotIdx);
  m.innerHTML = `<div class="sheet"><div class="reshead"><canvas id="wbFace" width="184" height="184"></canvas><div><h2>Welcome back!</h2><p class="subt">You were away for ${fmtTime(away)}.</p></div></div>
    <div class="rrows"><div class="rrow"><span class="rl">Mission Control & satellites</span><span class="rv num">${fmtTime(secs)} at ${Math.round(offlineEff(lvl) * 100)}%</span><span class="ra num">${money(amt)}</span></div></div>
    <div class="btns"><button class="btn orange" id="wbOk">Collect</button></div></div>`;
  m.hidden = false;
  drawFace($('wbFace').getContext('2d'), 184, 'excited', look, 0);
  $('wbOk').onclick = () => { m.hidden = true; AudioSys.init(); AudioSys.sfx('coin'); };
}

// ---------------- input ----------------
function onKey(e) {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  let n = null;
  if (/^Digit[0-9]$/.test(e.code)) n = +e.code.slice(5);
  else if (/^Numpad[0-9]$/.test(e.code)) n = +e.code.slice(6);
  else if (/^[0-9]$/.test(e.key)) n = +e.key;
  if (n == null) return;
  AudioSys.init();
  if (!$('results').hidden) {
    if (n === 1) { e.preventDefault(); $('btnHangar').click(); }
    if (n === 2) { e.preventDefault(); $('btnAgain').click(); }
    return;
  }
  if (!$('modal').hidden) return;
  if (mode === 'flight') { e.preventDefault(); if (!e.repeat) pressAction(n); }
}

// ---------------- main loop ----------------
let lastT = performance.now(), saveT = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, (now - lastT) / 1000); lastT = now;
  // idle income
  const rate = passiveRate();
  if (rate > 0 && mode !== 'loading') { earn(rate * dt); }
  saveT += dt; if (saveT > 10) { saveT = 0; saveGame(); }
  const P = perfProbe, T = () => performance.now();
  let t0 = T();
  if (mode === 'flight' && flight) {
    if (!paused && $('results').hidden) {
      flightTick(flight, dt);
      P.sim += T() - t0; t0 = T();
      processEvents();
      if (flight) {
        updateRocketVisual(dt);
        P.vis += T() - t0; t0 = T();
        predT -= dt;
        if (predT <= 0 && flight.launched && !flight.landed) {
          predT = 0.35;
          lastPred = (flight.alt > 25 || mapWanted()) ? predictPath(flight) : null;
        }
        const showPath = !!lastPred && (mapWanted() || (flight.alt > 60 && flight.alive));
        setPath(lastPred, showPath);
        P.pred += T() - t0; t0 = T();
        updateDebris(dt, flight.warp);
        updateHUD(dt);
        P.hud += T() - t0; t0 = T();
      }
    }
  } else if (mode === 'hangar') {
    if (hangarModel) {
      faceT += dt;
      if (faceT > 0.6) { faceT = 0; drawRocketFace(hangarModel, 'happy', pilotLook(save.pilotIdx), now / 1000); }
    }
  }
  // top-bar money counter
  displayMoney += (save.money - displayMoney) * Math.min(1, dt * 8);
  if (Math.abs(save.money - displayMoney) < 0.5) displayMoney = save.money;
  if (mode === 'hangar') {
    $('money').textContent = money(displayMoney);
    uiRefreshT += dt;
    if (uiRefreshT > 1) { uiRefreshT = 0; refreshAffordability(); }
  }
  if (mode === 'flight' && flight) updateCamera(dt); else updateCamera(dt);
  t0 = T();
  updateFX(dt, camera.position);
  P.fx += T() - t0; t0 = T();
  updateSky(dt);
  renderer.render(scene, camera);
  P.render += T() - t0;
  P.frames++; P.js += T() - now;
}
const perfProbe = { frames: 0, js: 0, sim: 0, vis: 0, pred: 0, hud: 0, fx: 0, render: 0 };
window.__rrPerf = perfProbe;
let uiRefreshT = 0, lastAfford = '';
function refreshAffordability() {
  // re-render buy buttons only when what you can afford changes
  const sig = PART_IDS.filter(id => !save.parts[id] && PARTS[id].cost <= save.money).length + '|' + UPGRADES.filter(u => upCost(u, save.up[u.id] || 0) <= save.money).length;
  renderTop();
  if (sig !== lastAfford) { lastAfford = sig; renderParts(); if (tab === 'upgrades') renderUpgrades(); }
}

// ---------------- boot ----------------
function boot() {
  save = loadGame();
  refreshMods();
  displayMoney = save.money;
  AudioSys.on = save.sound;
  initRenderer();
  // UI wiring
  for (const b of document.querySelectorAll('#tabs button')) b.onclick = () => { setTab(b.dataset.tab); AudioSys.init(); AudioSys.sfx('click'); };
  $('btnLaunch').onclick = () => { AudioSys.init(); startFlight(); };
  $('btnSound').onclick = () => toggleSound();
  $('goal').onclick = () => showGoals();
  $('btnPause').onclick = () => openPause();
  $('btnTakeover').onclick = () => { if (flight) { flight.plan = 'manual'; flight.throttle = 1; if (['prof', 'horiz', 'ap', 'kick'].includes(flight.steer)) flight.steer = flight.landed ? 'up' : 'pro'; flight.autoStage = !!save.up.a_stage && save.assistStage; flight.autoLand = !!save.up.a_land && save.assistLand; $('apBadge').hidden = true; toast('You have control!'); } };
  window.addEventListener('keydown', onKey);
  document.addEventListener('visibilitychange', () => { if (document.hidden) saveGame(); else { offlineCheck(); lastT = performance.now(); } });
  window.addEventListener('pagehide', saveGame);
  window.addEventListener('resize', () => showCoach());
  document.addEventListener('pointerdown', () => AudioSys.init(), { once: true });
  enterHangar();
  offlineCheck();
  $('loading').hidden = true;
  requestAnimationFrame(frame);
}
try { boot(); } catch (e) { console.error(e); document.getElementById('loading').hidden = false; document.getElementById('loadMsg').textContent = 'The game failed to start: ' + e.message; }
</script>
