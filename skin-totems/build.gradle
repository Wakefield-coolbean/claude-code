plugins {
 id 'fabric-loom' version '1.14.10'
 id 'maven-publish'
}
version = '1.1.0'
group = 'dev.skintotems'
base { archivesName = 'skin-totems' }
repositories { mavenCentral() }
dependencies {
 minecraft 'com.mojang:minecraft:1.21.11'
 mappings 'net.fabricmc:yarn:1.21.11+build.6:v2'
 modImplementation 'net.fabricmc:fabric-loader:0.18.4'
 modImplementation 'net.fabricmc.fabric-api:fabric-api:0.141.6+1.21.11'
}
java { sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21; withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.release = 21 }

fabricApi.configureTests {
    createSourceSet = true
    modId = 'skin_totems_test'
    enableGameTests = false
    enableClientGameTests = true
    eula = false
}
